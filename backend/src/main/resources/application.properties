spring.application.name=collina-api
server.port=8080

# ======================================================
# Conexão com o PostgreSQL local
# ======================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/collina_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================================
# Configuração do JPA / Hibernate
# ======================================================
# 'update' cria e atualiza as tabelas automaticamente no banco a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


