spring.application.name=collina-api
server.port=8080

# ======================================================
# Conexão com o PostgreSQL local
# ======================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/collina_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================================
# Configuração do JPA / Hibernate
# ======================================================
# 'update' cria e atualiza as tabelas automaticamente no banco a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ======================================================
# Firebase Auth (veja a seção "Autenticação" do README)
# ======================================================
# Caminho do JSON da conta de serviço do Firebase (NUNCA commitar esse arquivo).
# Pode ser definido pela variável de ambiente FIREBASE_CREDENTIALS_PATH. Se vazio, usa GOOGLE_APPLICATION_CREDENTIALS.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
# ID do projeto Firebase (opcional quando já consta no JSON da conta de serviço)
firebase.project-id=${FIREBASE_PROJECT_ID:}
# true = consulta o Firebase a cada requisição para barrar tokens revogados/usuários desativados (mais lento)
firebase.check-revoked=false

# E-mails (separados por vírgula) que viram ADMIN automaticamente. O e-mail precisa estar verificado no Firebase.
collina.auth.admin-emails=${COLLINA_ADMIN_EMAILS:}

# Origens do front-end autorizadas no CORS (separadas por vírgula)
collina.cors.allowed-origins=${COLLINA_CORS_ORIGINS:http://localhost:5173}