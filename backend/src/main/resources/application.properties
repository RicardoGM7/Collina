spring.application.name=collina-api
server.port=8080

# ======================================================
# Conexão com o PostgreSQL local
# ======================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/collina_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================================
# Configuração do JPA / Hibernate
# ======================================================
# 'update' cria e atualiza as tabelas automaticamente no banco a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# ======================================================
# Configuração do Google Gemini (Spring AI)
# ======================================================
# Chave protegida via variável de ambiente (não exposta no GitHub)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-4-hydrogen
